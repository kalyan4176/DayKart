version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: daykart-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - daykart-network

  redis:
    image: redis:7.2-alpine
    container_name: daykart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - daykart-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: daykart-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - daykart-network

  mailhog:
    image: mailhog/mailhog
    container_name: daykart-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # HTTP Web UI
    networks:
      - daykart-network

volumes:
  mongodb_data:
  redis_data:
  elasticsearch_data:

networks:
  daykart-network:
    driver: bridge
